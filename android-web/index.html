<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#102a43" />
    <title>نظام إدارة المطاعم</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #102a43; color: #fff; font-family: system-ui, sans-serif; text-align: center; }
      main { width: min(100%, 440px); padding: 28px; border: 1px solid #ffffff30; border-radius: 20px; background: #ffffff10; }
      h1 { margin-top: 0; font-size: 1.5rem; }
      p { line-height: 1.9; color: #e5edf5; }
      code { display: inline-block; direction: ltr; padding: 8px 12px; border-radius: 8px; background: #071b2c; color: #f7d774; }
    </style>
  </head>
  <body>
    <main>
      <h1>نظام إدارة المطاعم</h1>
      <p>تعذر الاتصال بخادم التشغيل المحلي في Termux.</p>
      <p>افتح Termux داخل مجلد المشروع وشغّل الخادم بالأمر:</p>
      <p><code>bun run dev --host 0.0.0.0</code></p>
      <p>ثم أعد فتح التطبيق. يجب أن يعمل الخادم على المنفذ 5173.</p>
    </main>
  </body>
</html>
