<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102b4e">
    <title>أنت غير متصل — نظام إدارة المطاعم</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f4f7fb; color: #142b46; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 440px); padding: 32px 24px; border: 1px solid #dce4ef; border-radius: 20px; background: white; text-align: center; box-shadow: 0 18px 50px #102b4e12; }
      .mark { width: 64px; height: 64px; margin: 0 auto 18px; }
      h1 { margin: 0 0 12px; font-size: 1.4rem; }
      p { margin: 0; color: #5c6d80; line-height: 1.9; }
      button { margin-top: 24px; border: 0; border-radius: 10px; padding: 12px 24px; background: #102b4e; color: white; font: inherit; cursor: pointer; }
      small { display: block; margin-top: 18px; color: #8a98a8; line-height: 1.7; }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/icon.svg" alt="">
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تعذر تحميل هذه الصفحة الآن. أعد الاتصال بالإنترنت ثم حاول مرة أخرى.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
      <small>لن يتم حفظ أي عملية مالية أو مخزنية أثناء انقطاع الاتصال.</small>
    </main>
  </body>
</html>
