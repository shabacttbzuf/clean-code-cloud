name: Temporary migration filename generator

on:
  push:
    branches: ["reconcile/security-notifications-into-integration"]
    paths:
      - ".github/workflows/_generate-migration-filenames.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Install the repository Supabase CLI version
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Generate unique migration filenames using Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          supabase migration new --help >/tmp/supabase-migration-help.txt
          names=(
            fix_promotion_gift_and_eligibility_calculation
          )
          for name in "${names[@]}"; do
            supabase migration new "$name"
            sleep 1
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "chore: generate unique migration filenames"
          git push origin "HEAD:${GITHUB_REF_NAME}"
